name: Windows installation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/configure-plugin.mjs
      - run: node scripts/verify-install.mjs
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -CheckOnly -SkipModels -SkipPluginInstall
      - run: npm test
